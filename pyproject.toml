[project]
name = "keepachangelog-manager-fork"
description = "Python package allowing you to manage your CHANGELOG.md files"
readme = "README.md"
version = "6.4.0"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
dependencies = [
    "jsonschema>=4.25.1,<5",
    "packaging>=24.0",
    "semantic_version>=2.10.0,<3",
    "urllib3>=2.7.0; python_version >= '3.10'",
    "urllib3>=2.6.0; python_version < '3.10'",
    "inquirer>=3.4.0",
    "tomli>=2.4.1; python_version < '3.11'",
    "keyring>=25.0,<27",
]
authors = [
    { name = "Matthew Martin", email = "matthewdeanmartin@gmail.com" },
    { name = "KevinDeJong-TomTom" },
]

[project.urls]
Homepage = "https://github.com/matthewdeanmartin/keepachangelog-manager"
Issues = "https://github.com/matthewdeanmartin/keepachangelog-manager/issues"
Source = "https://github.com/matthewdeanmartin/keepachangelog-manager"

[project.scripts]
changelogmanager = "changelogmanager.__main__:main"
kacl-gui = "changelogmanager.__main__:gui_main"
keepachangelog-manager = "changelogmanager.__main__:main"
changelogmanager-lint-message = "changelogmanager.lint_message_cli:main"


[project.optional-dependencies]
format = [
    "mdformat>=0.7",
]
# Fast, C-backed drop-in replacements for the stdlib. Optional because their
# native wheels are not available on every interpreter (e.g. brand-new CPython
# releases); the code falls back to stdlib re/json when they are absent.
fast = [
    "google-re2>=1.1.20251105; python_version >= '3.10'",
    "google-re2==1.1.20250805; python_version < '3.10'",
    "orjson>=3.11.5",
]
all = [
    "mdformat>=0.7",
    "google-re2>=1.1.20251105; python_version >= '3.10'",
    "google-re2==1.1.20250805; python_version < '3.10'",
    "orjson>=3.11.5",
]

[dependency-groups]
test = [
    "freezegun",
    "hypothesis",
    "mdformat>=0.7",
    "pytest>7.0.0",
    "pytest-cov",
    "pytest-mock",
    "pytest-xdist>=3.5.0",
    "pytest-randomly>=3.15.0",
    "syrupy>=4.0.0",
]
lint = [
    "black>=25.0.0",
    "flake8>1.0.0",
    "flake8-pyproject>1.0.0",
    "flake8_formatter_junit_xml>=0.0.6",
    "mypy>=1.0.0",
    "pylint>1.0.0",
    "ruff>=0.15.12",
    "types-jsonschema",
    "ty",
    "pyrefly",
]
security = [
    "bandit>1.0.0",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "security" },
    # Install the fast backends in the dev env so day-to-day work exercises the
    # orjson/re2 code paths (CI on new interpreters tests the stdlib fallback).
    "google-re2>=1.1.20251105; python_version >= '3.10'",
    "orjson>=3.11.5",
    "dead>=2.1.0",
    "dont-be-lazy>=0.1.0; python_version >= '3.10'",
    "vulture>=2.16",
]

[build-system]
requires = [
    "hatchling>=1.27",
]
build-backend = "hatchling.build"


[tool.mypy]
python_version = "3.9"
strict = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
show_error_codes = true
exclude = ["\\.venv", "build"]
follow_imports = "silent"

[[tool.mypy.overrides]]
module = "semantic_version.*"
ignore_missing_imports = true

[tool.uv]
default-groups = ["dev"]
exclude-newer = "7 days"


[tool.changelogmanager.versioning]
scheme = "semver"

[tool.changelogmanager.validation]
enforce_preamble = true
format = "auto"

[tool.changelogmanager.defaults]
error_format = "github"
commit_schema = "keepachangelog"
schema_version = "current"

[[tool.changelogmanager.components]]
name = "default"
changelog = "CHANGELOG.md"


[tool.ruff]
line-length = 160
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH", "ERA"]
ignore = [
    "E203", "E501", # line length handled by line-length,
    "E402", # Sick and tired of this stupid rule.
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811", "ARG001", "ARG002", "ARG005", "A004"]
"changelogmanager/llvm_diagnostics/*" = ["N818", "A001"]
# Vendored from jiggle-version: keep the upstream structure (the two file-match
# branches stay separate for readability) rather than refactoring a copy.
"changelogmanager/vendor/jiggle_version/*" = ["SIM114"]
"tests/test_vendored_keepachangelog/*" = ["I001", "PTH118", "PTH123", "SIM117", "UP015", "W291"]

[tool.hatch.build.targets.wheel]
packages = ["changelogmanager"]
# Ship the vendored jiggle-version attribution (MIT requires the license to
# travel with the copied code).
force-include = { "changelogmanager/vendor/jiggle_version/LICENSE" = "changelogmanager/vendor/jiggle_version/LICENSE", "changelogmanager/vendor/jiggle_version/UPSTREAM.md" = "changelogmanager/vendor/jiggle_version/UPSTREAM.md" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "snapshot: snapshot regression tests (run with tests/test_snapshots/ or -m snapshot)",
]

[tool.coverage.run]
source = ["changelogmanager"]

[tool.flake8]
exclude = [
    ".cache",
    ".eggs",
    ".git",
    ".tox",
    "__pycache__",
    "doc/source/conf.py",
    "venv*",
    "*.pyc",
    "*.egg-info",
]
ignore = [
    "E121",
    "E123",
    "E126",
    "E133",
    "E203",
    "E221",
    "E226",
    "E241",
    "E242",
    "E251",
    "E704",
    "W503",
    "W504",
    "W505",
]
max-line-length = 160

[tool.vulture]
min_confidence = 60
paths = ["changelogmanager"]
ignore_names = ["__getattr__"]
