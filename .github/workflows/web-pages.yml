# Build the KATL Angular app (web/) and deploy it to GitHub Pages.
name: Deploy KATL web app

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Vitest runs the pure-logic specs in Node — no browser needed.
      - run: npm test
      # base-href must match the repo name so assets resolve under
      # https://<user>.github.io/keepachangelog-manager/
      - run: npm run build -- --base-href=/keepachangelog-manager/
      - name: SPA fallback (404 -> index.html)
        run: cp dist/web/browser/index.html dist/web/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist/web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
