# ─────────────────────────────────────────────────────────────────────────────
# Release workflow
#
# Triggered when a GitHub Release is published (the draft-release workflow
# keeps the draft up to date; a human publishes it when ready).
#
# Job sequence
# ────────────
#   1. bump     Branch off target_commitish, run `release --bump-versions`,
#               commit CHANGELOG.md + pyproject.toml, push branch, open PR.
#               This is the ONLY place the version is written into the repo.
#               All later jobs build from this branch so the dist version
#               matches the changelog version.
#
#   2. build    Check out the bump branch, build the wheel + sdist.
#               Uploads the dist/ folder as an artifact.
#
#   3. publish  Download the artifact and push to PyPI using OIDC (no tokens
#               stored in the repo).
#
# Failure recovery
# ────────────────
#   bump fails   → nothing built, nothing published.  Re-run the release.
#
#   build fails  → the PR branch exists but nothing was published.
#                  Close the PR, delete the GitHub Release, fix the build
#                  issue, then re-publish the GitHub Release to retry.
#
#   publish fails → the dist artifact exists and the PR branch is open.
#                   Option A: re-run only the publish job (GitHub lets you
#                   re-run a single failed job).
#                   Option B: close the PR, delete the GitHub Release, then
#                   re-publish the release to start over cleanly.
# ─────────────────────────────────────────────────────────────────────────────

---
name: Release

concurrency: changelog

on:
  release:
    types: [released]

permissions:
  contents: read

jobs:

  # ── 1. Bump versions, commit, push branch, open PR ──────────────────────
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    outputs:
      branch: ${{ steps.push.outputs.branch }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Check out the branch the release targets, not the tag, so the
          # commit we push can be fast-forward merged back into main.
          ref: ${{ github.event.release.target_commitish }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: { python-version: '3.14' }

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Sync dependencies (with jiggle extra)
        run: uv sync --frozen --extra jiggle

      - name: Bump changelog and version files
        id: release
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          # Strip leading 'v' so changelogmanager and pyproject.toml both get
          # a bare semver string like "1.3.0".
          VERSION="${RELEASE_VERSION#v}"
          uv run changelogmanager release \
            --override-version "$VERSION" \
            --bump-versions \
            --yes
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit and push bump branch
        id: push
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          BASE_BRANCH: ${{ github.event.release.target_commitish }}
          REPO: ${{ github.repository }}
        run: |
          BRANCH="release/bump-${RELEASE_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add CHANGELOG.md pyproject.toml
          # Surface any other files jiggle touched (e.g. __about__.py)
          git add -u
          if git diff --cached --quiet; then
            echo "::warning::No files changed after release --bump-versions; is the version already bumped?"
            exit 1
          fi
          git commit -m "chore: release ${{ steps.release.outputs.version }}"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
          git push origin "${BRANCH}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          BASE_BRANCH: ${{ github.event.release.target_commitish }}
          REPO: ${{ github.repository }}
        run: |
          uv run changelogmanager github-pr \
            --repository "${REPO}" \
            --head "${{ steps.push.outputs.branch }}" \
            --base "${BASE_BRANCH}" \
            --title "chore: release ${RELEASE_VERSION}" \
            --body "$(cat <<'EOF'
          Automated release PR for **${{ steps.release.outputs.version }}**.

          Changes:
          - `CHANGELOG.md`: promoted `[Unreleased]` to `${{ steps.release.outputs.version }}`
          - `pyproject.toml`: version bumped to `${{ steps.release.outputs.version }}`
          - Any `__version__` strings in the source tree updated to `${{ steps.release.outputs.version }}`

          This PR was opened automatically by the Release workflow.
          Merge it once the PyPI publish below succeeds.

          **Recovery:** if the build or publish jobs fail, close this PR,
          delete the GitHub Release, fix the issue, then re-publish the
          release to start over.
          EOF
          )"

  # ── 2. Build the distribution from the bump branch ──────────────────────
  build:
    runs-on: ubuntu-latest
    needs: bump

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Build from the bump branch so pyproject.toml carries the correct
          # version.  Building from the original tag would give the old version.
          ref: ${{ needs.bump.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: { python-version: '3.14' }

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Build
        run: uv build --no-sources

      - name: Verify dist version matches release
        env:
          EXPECTED: ${{ needs.bump.outputs.version }}
        run: |
          # Check that the wheel filename contains the expected version.
          WHEEL=$(ls dist/*.whl 2>/dev/null | head -1)
          if [ -z "$WHEEL" ]; then
            echo "::error::No wheel found in dist/"
            exit 1
          fi
          if ! echo "$WHEEL" | grep -q "${EXPECTED}"; then
            echo "::error::Wheel ${WHEEL} does not contain expected version ${EXPECTED}"
            exit 1
          fi
          echo "Verified: ${WHEEL} matches version ${EXPECTED}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # ── 3. Publish to PyPI via OIDC ─────────────────────────────────────────
  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/keepachangelog-manager-fork

    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          verbose: 'true'
