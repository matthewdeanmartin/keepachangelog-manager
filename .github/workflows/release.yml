# ─────────────────────────────────────────────────────────────────────────────
# Release workflow
#
# Triggered when a GitHub Release is published (the draft-release workflow
# keeps the draft up to date; a human publishes it when ready).
#
# Job sequence
# ────────────
#   1. bump     Branch off target_commitish, run `release --bump-versions`,
#               commit CHANGELOG.md + pyproject.toml, push branch, open PR.
#               This is the ONLY place the version is written into the repo.
#               All later jobs build from this branch so the dist version
#               matches the changelog version.
#
#   2. build    Check out the bump branch, build the wheel + sdist.
#               Uploads the dist/ folder as an artifact.
#
#   3. publish  Download the artifact and push to PyPI using OIDC (no tokens
#               stored in the repo).
#
# Failure recovery
# ────────────────
#   bump fails   → nothing built, nothing published.  Re-run the release.
#
#   build fails  → the PR branch exists but nothing was published.
#                  Close the PR, delete the GitHub Release, fix the build
#                  issue, then re-publish the GitHub Release to retry.
#
#   publish fails → the dist artifact exists and the PR branch is open.
#                   Option A: re-run only the publish job (GitHub lets you
#                   re-run a single failed job).
#                   Option B: close the PR, delete the GitHub Release, then
#                   re-publish the release to start over cleanly.
# ─────────────────────────────────────────────────────────────────────────────

---
name: Release

concurrency: changelog

on:
  release:
    types: [released]

permissions:
  contents: read

jobs:

  # ── 1. Bump versions, commit, push branch, open PR ──────────────────────
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    outputs:
      branch: ${{ steps.release.outputs.branch }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Check out the branch the release targets, not the tag, so the
          # commit we push can be fast-forward merged back into main.
          ref: ${{ github.event.release.target_commitish }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: '3.14' }

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump, commit, push branch and open PR
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
          RELEASE_ID: ${{ github.event.release.id }}
          BASE_BRANCH: ${{ github.event.release.target_commitish }}
          REPO: ${{ github.repository }}
        run: |
          # One command does everything the bump job used to do in shell:
          # bump changelog + version files, branch, [skip ci] commit,
          # --force-with-lease push, and open the release PR. The [skip ci]
          # decision follows [defaults].skip_ci (default true).
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
          VERSION="${RELEASE_VERSION#v}"
          uv run kaclm release-bump \
            --version "$VERSION" \
            --base "$BASE_BRANCH" \
            --release-id "$RELEASE_ID" \
            --repository "$REPO" \
            --open-pr \
            --title "chore: release ${VERSION}" \
            --body "Automated release PR for ${VERSION}. Merge once the PyPI publish succeeds." \
            --yes \
            --json > release-bump.json
          echo "version=$(python -c "import json;print(json.load(open('release-bump.json'))['version'])")" >> "$GITHUB_OUTPUT"
          echo "branch=$(python -c "import json;print(json.load(open('release-bump.json'))['branch'])")" >> "$GITHUB_OUTPUT"

  # ── 2. Build the distribution from the bump branch ──────────────────────
  build:
    runs-on: ubuntu-latest
    needs: bump

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Build from the bump branch so pyproject.toml carries the correct
          # version.  Building from the original tag would give the old version.
          ref: ${{ needs.bump.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: '3.14' }

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Build
        run: uv build --no-sources

      - name: Verify dist version matches release
        env:
          EXPECTED: ${{ needs.bump.outputs.version }}
        run: |
          # Check that the wheel filename contains the expected version.
          WHEEL=$(ls dist/*.whl 2>/dev/null | head -1)
          if [ -z "$WHEEL" ]; then
            echo "::error::No wheel found in dist/"
            exit 1
          fi
          if ! echo "$WHEEL" | grep -q "${EXPECTED}"; then
            echo "::error::Wheel ${WHEEL} does not contain expected version ${EXPECTED}"
            exit 1
          fi
          echo "Verified: ${WHEEL} matches version ${EXPECTED}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # ── 3. Publish to PyPI via OIDC ─────────────────────────────────────────
  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/keepachangelog-manager-fork

    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          verbose: 'true'
