# ─────────────────────────────────────────────────────────────────────────────
# GitLab CI/CD — release process proof-of-concept
#
# Mirrors the GitHub Actions release workflow (.github/workflows/release.yml) on
# GitLab so we can confirm keepachangelog-manager-fork drives a GitLab release.
#
# What it does (NO PyPI publish — deliberately omitted for this PoC):
#   1. validate  Lint the CHANGELOG.md so a broken changelog stops the pipeline.
#   2. release   Run `release --bump-versions`, commit CHANGELOG.md +
#                pyproject.toml on a `release/bump-<pipeline>` branch, push it,
#                and open a Merge Request back into the default branch.
#   3. gl-release  Create/update the GitLab Release object from [Unreleased]
#                  (idempotent upsert; GitLab has no draft state).
#
# Trigger
# ───────
#   Manual ("Run pipeline") on the default branch. Kept off automatic pushes so
#   it never opens a release MR on every commit. Flip the `rules:` below to
#   `$CI_PIPELINE_SOURCE == "schedule"` etc. if you want it automated.
#
# Tokens
# ──────
#   CI_JOB_TOKEN (always present) is enough for `gitlab-release`. Opening an MR
#   and pushing a branch needs a token with `api` + `write_repository` scope:
#   set a CI/CD variable named GITLAB_PAT (a Project Access Token works well).
#   The job falls back to CI_JOB_TOKEN where that is sufficient.
# ─────────────────────────────────────────────────────────────────────────────

stages:
  - validate
  - release
  - gl-release

default:
  image: python:3.12
  before_script:
    # uv gives us the same locked-env workflow the repo uses elsewhere.
    - pip install --quiet uv
    - uv sync --frozen

workflow:
  rules:
    # Only run the whole pipeline when launched manually on the default branch.
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

# ── 1. Validate the changelog ───────────────────────────────────────────────
validate:changelog:
  stage: validate
  script:
    - uv run changelogmanager --error-format github validate

# ── 2. Release: bump, commit, push branch, open MR ──────────────────────────
release:open-mr:
  stage: release
  variables:
    # Token used for git push + the MR API call. Define GITLAB_PAT in CI/CD
    # settings (api + write_repository). CI_JOB_TOKEN cannot push branches.
    GIT_TOKEN: $GITLAB_PAT
  script:
    - |
      set -euo pipefail

      # Resolve the version the changelog will be released as.
      VERSION="$(uv run changelogmanager --json version --reference future | python -c 'import sys,json;print(json.load(sys.stdin)["version"])')"
      echo "Releasing version ${VERSION}"

      # Promote [Unreleased] and sync pyproject.toml / __version__ strings.
      uv run changelogmanager release --bump-versions --yes

      BRANCH="release/bump-${CI_PIPELINE_ID}"
      git config user.name "gitlab-ci"
      git config user.email "gitlab-ci@example.com"
      git checkout -b "${BRANCH}"
      git add CHANGELOG.md pyproject.toml
      git add -u
      if git diff --cached --quiet; then
        echo "No changes after release --bump-versions; is the version already bumped?"
        exit 1
      fi
      git commit -m "chore: release ${VERSION} [skip ci]"

      # Push using the PAT (CI_JOB_TOKEN cannot create branches).
      git remote set-url origin "https://oauth2:${GIT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git push origin "HEAD:${BRANCH}" -o ci.skip

      # Open the merge request via the REST API (no native gitlab-mr command yet).
      curl --silent --show-error --fail \
        --request POST \
        --header "PRIVATE-TOKEN: ${GIT_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "$(python - "$BRANCH" "$VERSION" "$CI_DEFAULT_BRANCH" <<'PY'
      import json, sys
      branch, version, target = sys.argv[1], sys.argv[2], sys.argv[3]
      print(json.dumps({
          "source_branch": branch,
          "target_branch": target,
          "title": f"chore: release {version}",
          "description": (
              f"Automated release MR for **{version}**.\n\n"
              "- `CHANGELOG.md`: promoted `[Unreleased]`\n"
              "- `pyproject.toml`: version bumped\n\n"
              "Opened by the GitLab release pipeline. No PyPI publish in this PoC."
          ),
          "remove_source_branch": True,
      }))
      PY
        )" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ── 3. Create the GitLab Release object ─────────────────────────────────────
#   Runs against the current ref. The CI_JOB_TOKEN is sufficient for the
#   Releases API, so no PAT is required here.
gitlab:release:
  stage: gl-release
  script:
    - uv run changelogmanager --error-format github gitlab-release
        --project "$CI_PROJECT_ID"
        --ref "$CI_COMMIT_SHA"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
